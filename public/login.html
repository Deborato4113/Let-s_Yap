<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Let's Yap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">
  <div class="login-container">
    <div class="brand-mark">Y</div>
    <h1 class="app-title">Let's Yap</h1>
    <p class="login-subtitle">Sign in to start chatting in real time</p>

    <div class="login-card">
      <label class="input-label" for="nameInput">Display name</label>
      <input id="nameInput" type="text" placeholder="Enter your name" autocomplete="name" />

      <label class="input-label" for="roomSelect">Choose a room</label>
      <select id="roomSelect">
        <option value="General">General</option>
        <option value="Development">Development</option>
        <option value="Gaming">Gaming</option>
        <option value="College">College</option>
        <option value="Random">Random</option>
      </select>

      <button id="guestBtn" class="login_primary-btn">
        Continue without Google
      </button>

      <div class="divider">
        <span>or</span>
      </div>

      <button id="googleBtn" class="btn google-btn">
        <svg class="g-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l6-6C34.6 5.4 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.5-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l6-6C34.6 5.4 29.6 3 24 3 16.3 3 9.6 7.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 36.4 26.9 37 24 37c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.5 40.6 16.2 45 24 45z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.6 5.4C41.4 35.7 45 30.4 45 24c0-1.4-.1-2.5-.4-3.5z"/>
        </svg>
        Continue with Google
      </button>
    </div>

    <p class="login-footnote">Your messages sync instantly across the room.</p>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>

  <script src="login.js"></script>
</body>
</html>
